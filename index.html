<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sri Ram Naam Jap | A Divine Journey</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #081629;
      --navy-light: #142b49;
      --gold: #d9b66f;
      --gold-light: #f4dfaa;
      --cream: #f8efd9;
      --saffron: #d88735;
      --muted: #c9bea7;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 18px;
      font-family: "Playfair Display", Georgia, serif;
      color: var(--cream);
      background:
        radial-gradient(ellipse at 50% 0%, #29466d 0%, transparent 48%),
        radial-gradient(circle at 10% 90%, #8c552522, transparent 35%),
        linear-gradient(145deg, #050d19, var(--navy), #101f38);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "✦";
      position: fixed;
      color: #e5c77b35;
      font-size: 150px;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      top: 5%;
      left: 5%;
    }

    body::after {
      bottom: 4%;
      right: 5%;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 465px;
      padding: 42px 34px 32px;
      text-align: center;
      border: 1px solid var(--gold);
      border-radius: 24px;
      background:
        linear-gradient(155deg, #1b3454 0%, #10213a 55%, #0b192d 100%);
      box-shadow:
        0 25px 70px #0009,
        inset 0 0 35px #e0bd6520;
      animation: appear 0.9s ease both;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .ornament {
      color: var(--gold);
      font-size: 25px;
      letter-spacing: 9px;
      margin-bottom: 19px;
    }

    .symbol {
      width: 82px;
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 19px;
      border: 1px solid #d9b66f88;
      border-radius: 50%;
      background: #d9b66f12;
      box-shadow: 0 0 25px #d9b66f20;
      font-size: 39px;
    }

    h1 {
      color: var(--gold-light);
      font-family: "Cinzel", Georgia, serif;
      font-size: clamp(25px, 6vw, 34px);
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: 1px;
    }

    .subtitle {
      margin-top: 12px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 25px 0;
      color: var(--gold);
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c9a45c);
    }

    .divider::after {
      background: linear-gradient(90deg, #c9a45c, transparent);
    }

    form {
      width: 100%;
    }

    input {
      width: 100%;
      padding: 15px 16px;
      margin: 9px 0;
      border: 1px solid #c9ad77;
      border-radius: 11px;
      outline: none;
      background: #f8f1e3;
      color: #17243a;
      font-family: Arial, sans-serif;
      font-size: 15px;
      transition: 0.25s ease;
    }

    input::placeholder {
      color: #777064;
    }

    input:focus {
      border-color: #f4d58e;
      box-shadow: 0 0 0 3px #e5c47730;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 13px;
      border: 1px solid #edce8d;
      border-radius: 11px;
      background: linear-gradient(135deg, #e8c779, #bd873b);
      color: #17233a;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: 0.25s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 20px #d9b66f35;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .switch {
      margin-top: 13px;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--gold-light);
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: normal;
    }

    .switch:hover {
      box-shadow: none;
      text-decoration: underline;
    }

    .google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 8px;
      border: 1px solid #d9cba9;
      background: #f8f5ed;
      color: #25334a;
      font-family: Arial, sans-serif;
      font-size: 15px;
      font-weight: 600;
    }

    .google:hover {
      background: #eee8db;
    }

    #message {
      min-height: 22px;
      margin-top: 17px;
      color: var(--gold-light);
      font-family: Arial, sans-serif;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .blessing {
      margin-top: 27px;
      color: var(--gold);
      font-size: 21px;
      letter-spacing: 1px;
    }

    .footer {
      margin-top: 9px;
      color: #b9ad96;
      font-size: 12px;
      line-height: 1.7;
    }

    @media (max-width: 480px) {
      body {
        padding: 18px 13px;
      }

      .card {
        padding: 32px 21px 25px;
      }

      .symbol {
        width: 72px;
        height: 72px;
        font-size: 34px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="ornament">✦ ─ 🪷 ─ ✦</div>

    <div class="symbol">🙏</div>

    <h1>Sri Ram Naam Jap</h1>

    <p class="subtitle" id="description">
      Begin your divine journey with the sacred name of Lord Sri Ram.
      Sign in to continue your chanting journey.
    </p>

    <div class="divider">
      <span>॥ जय श्री राम ॥</span>
    </div>

    <form id="authForm">

      <input
        id="email"
        type="email"
        placeholder="Email address"
        autocomplete="email"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        minlength="6"
        required
      >

      <button id="submitBtn" type="submit">
        Login
      </button>

    </form>

    <button class="switch" id="switchBtn" type="button">
      New here? Create an account
    </button>

    <div class="divider">
      <span>OR</span>
    </div>

    <button class="google" id="googleBtn" type="button">
      <span>G</span>
      Continue with Google
    </button>

    <p id="message" role="status" aria-live="polite"></p>

    <div class="blessing">॥ श्री राम जय राम जय जय राम ॥</div>

    <p class="footer">
      May the divine name of Sri Ram bring peace, strength and happiness to your heart.
    </p>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js"></script>

  <script>
    const client = window.supabaseClient;

    const form = document.getElementById("authForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const submitBtn = document.getElementById("submitBtn");
    const switchBtn = document.getElementById("switchBtn");
    const googleBtn = document.getElementById("googleBtn");
    const description = document.getElementById("description");
    const message = document.getElementById("message");

    let isSignup = false;

    function showMessage(text) {
      message.textContent = text;
    }

    switchBtn.addEventListener("click", () => {
      isSignup = !isSignup;

      submitBtn.textContent = isSignup ? "Create Account" : "Login";

      switchBtn.textContent = isSignup
        ? "Already registered? Login"
        : "New here? Create an account";

      description.textContent = isSignup
        ? "Create your account and begin your divine chanting journey."
        : "Begin your divine journey with the sacred name of Lord Sri Ram. Sign in to continue your chanting journey.";

      passwordInput.autocomplete = isSignup
        ? "new-password"
        : "current-password";

      showMessage("");
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!client) {
        showMessage("Connection error. Please check supabase.js.");
        return;
      }

      submitBtn.disabled = true;
      showMessage("Please wait...");

      try {
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (isSignup) {
          const { data, error } = await client.auth.signUp({
            email,
            password,
            options: {
              emailRedirectTo:
                window.location.origin + window.location.pathname
            }
          });

          if (error) throw error;

          if (data.session) {
            window.location.href = "./jap.html";
          } else {
            showMessage(
              "Account created. Check your email to confirm, then log in."
            );
          }

        } else {
          const { error } = await client.auth.signInWithPassword({
            email,
            password
          });

          if (error) throw error;

          window.location.href = "./jap.html";
        }

      } catch (error) {
        showMessage(error.message || "Something went wrong.");
      } finally {
        submitBtn.disabled = false;
      }
    });

    googleBtn.addEventListener("click", async () => {
      if (!client) {
        showMessage("Connection error. Please check supabase.js.");
        return;
      }

      googleBtn.disabled = true;
      showMessage("Opening Google sign-in...");

      try {
        const { error } = await client.auth.signInWithOAuth({
          provider: "google",
          options: {
            redirectTo:
              "https://harshini-a5.github.io/sri-ram-naam-jap/jap.html"
          }
        });

        if (error) throw error;

      } catch (error) {
        showMessage(error.message || "Google sign-in failed.");
        googleBtn.disabled = false;
      }
    });

    client?.auth.getSession().then(({ data, error }) => {
      if (error) {
        showMessage(error.message);
      } else if (data.session) {
        window.location.href = "./jap.html";
      }
    });
  </script>

</body>
</html>
