
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sri Ram - Divine Image Formation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            margin: 0;
            padding: 12px;
            min-height: 100vh;
            color: #f7edcf;
            text-align: center;
            font-family: 'Playfair Display', Georgia, serif;
            background:
                radial-gradient(circle at top, #263d62, transparent 48%),
                linear-gradient(145deg, #07152b, #102747, #071326);
        }

        .container {
            width: 100%;
            max-width: 1250px;
            min-height: calc(100vh - 24px);
            margin: auto;
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            background: linear-gradient(145deg, #142c4b, #0b1b32);
            border: 2px solid #c7a65b;
            border-radius: 22px;
            box-shadow: 0 15px 45px #0008,
                        inset 0 0 25px #d5b66b12;
        }

        .symbol {
            color: #e5c778;
            font-size: 27px;
            margin-bottom: 3px;
        }

        h1 {
            margin: 5px 0;
            color: #e8ca7e;
            font-family: 'Cinzel', Georgia, serif;
            font-size: clamp(23px, 4vw, 36px);
            letter-spacing: 1px;
        }

        .subtitle {
            margin: 4px 0 12px;
            color: #e1d4b2;
            font-size: 15px;
            line-height: 1.5;
        }

        .count-card {
            width: 100%;
            margin: 0 auto 12px;
            padding: 12px 18px;
            background: linear-gradient(145deg, #1b3555, #102440);
            border: 1px solid #c7a65b;
            border-radius: 16px;
        }

        .count-card h2 {
            margin: 0;
            color: #e8ca7e;
            font-family: 'Cinzel', Georgia, serif;
            font-size: 17px;
        }

        #count {
            margin: 4px 0;
            color: #f1d58c;
            font-size: 42px;
            font-weight: bold;
        }

        .remaining {
            margin: 3px 0;
            color: #e4d5b1;
            font-size: 15px;
            font-weight: bold;
        }

        #remaining {
            display: inline-block;
            margin-left: 5px;
            color: #f1d58c;
            font-size: 23px;
        }

        .track {
            width: 100%;
            max-width: 700px;
            height: 13px;
            margin: 10px auto 5px;
            overflow: hidden;
            background: #07152b;
            border: 1px solid #b99a58;
            border-radius: 20px;
        }

        #progressBar {
            width: 0%;
            height: 100%;
            background: linear-gradient(
                90deg,
                #b88b3d,
                #f5d98c,
                #c39748
            );
            border-radius: 20px;
            transition: width 0.5s ease;
        }

        #progressText {
            margin: 4px 0 0;
            color: #e8d7b2;
            font-size: 14px;
        }

        .image-frame {
            position: relative;
            flex: 1;
            width: 100%;
            min-height: 320px;
            margin: 0 auto 12px;
            overflow: hidden;
            border: 5px solid #d7b66c;
            border-radius: 22px;
            background: linear-gradient(160deg, #263e5c, #8b6937);
            box-shadow: 0 0 25px #d9b45c55,
                        inset 0 0 20px #0006;
        }

        #puzzleGrid {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
        }

        .puzzle-tile {
            min-width: 0;
            min-height: 0;
            background-repeat: no-repeat;
            opacity: 0;
            transform: scale(0.65) rotate(5deg);
            transition:
                opacity 0.55s ease,
                transform 0.65s cubic-bezier(.2, .8, .2, 1);
            border: 1px solid #d9bd7950;
        }

        .puzzle-tile.revealed {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        #imageMessage {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 22px;
            color: #f5df9e;
            background: #07152b85;
            font-size: clamp(16px, 2vw, 22px);
            font-weight: bold;
            line-height: 1.7;
            text-shadow: 0 2px 8px #000;
            pointer-events: none;
        }

        .bottom-section {
            width: 100%;
            margin-top: auto;
        }

        .button-row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        button {
            margin: 3px;
            padding: 12px 22px;
            border: 1px solid #e2c477;
            border-radius: 12px;
            color: #132541;
            background: linear-gradient(135deg, #f1d58c, #c49a4b);
            font: bold 15px 'Playfair Display', Georgia, serif;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 16px #d8b45c44;
        }

        #resetButton {
            color: #f3dfb0;
            background: #263b57;
            border-color: #b89b60;
        }

        .blessing {
            margin: 8px 0 2px;
            color: #edcf80;
            font-family: 'Cinzel', Georgia, serif;
            font-size: 23px;
            font-weight: bold;
        }

        .footer-text {
            margin: 2px 0 0;
            color: #d8c9a8;
            font-size: 13px;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            body {
                padding: 7px;
            }

            .container {
                min-height: calc(100vh - 14px);
                padding: 12px 10px;
                border-radius: 17px;
            }

            .symbol {
                font-size: 23px;
            }

            h1 {
                font-size: 23px;
            }

            .subtitle {
                font-size: 13px;
                margin-bottom: 9px;
            }

            .count-card {
                padding: 10px;
                margin-bottom: 9px;
            }

            #count {
                font-size: 35px;
            }

            .image-frame {
                min-height: 300px;
                border-width: 4px;
                border-radius: 18px;
            }

            button {
                padding: 11px 15px;
                font-size: 13px;
            }

            .blessing {
                font-size: 20px;
            }

            .footer-text {
                font-size: 12px;
            }
        }

        @media (max-height: 650px) and (min-width: 601px) {
            .container {
                min-height: 620px;
            }

            .image-frame {
                min-height: 260px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <header>
            <div class="symbol">🙏 🪷 🙏</div>

            <h1>Sri Ram Image Formation</h1>

            <p class="subtitle">
                Every chant brings you closer to revealing the divine image.
            </p>
        </header>

        <section class="count-card">
            <h2>Total Sri Ram Chants</h2>

            <div id="count">0</div>

            <p class="remaining">
                Chants remaining
                <span id="remaining">108</span>
            </p>

            <div class="track">
                <div id="progressBar"></div>
            </div>

            <p id="progressText">0% completed</p>
        </section>

        <div class="image-frame">
            <div
                id="puzzleGrid"
                aria-label="Sri Ram image gradually revealed as puzzle tiles">
            </div>

            <div id="imageMessage">
                Continue chanting to reveal the divine image 🙏
            </div>
        </div>

        <footer class="bottom-section">
            <div class="button-row">
                <button id="backButton">← Back to Chanting</button>
                <button id="resetButton">↻ Reset Count</button>
            </div>

            <div class="blessing">॥ जय श्री राम ॥</div>

            <p class="footer-text">
                May Sri Ram bless you with peace and happiness. 🪔
            </p>
        </footer>

    </main>

    <script>
        const countDisplay = document.getElementById("count");
        const remainingDisplay = document.getElementById("remaining");
        const progressBar = document.getElementById("progressBar");
        const progressText = document.getElementById("progressText");
        const puzzleGrid = document.getElementById("puzzleGrid");
        const imageMessage = document.getElementById("imageMessage");

        const rows = 8;
        const columns = 8;
        const totalTiles = rows * columns;
        const tiles = [];

        function readNumber(key, fallback) {
            const value = Number(localStorage.getItem(key));

            return Number.isFinite(value) && value >= 0
                ? value
                : fallback;
        }

        function createPuzzle() {
            puzzleGrid.innerHTML = "";
            tiles.length = 0;

            const currentImage =
                localStorage.getItem("sriramCurrentImage") || "sriram.jpg";

            for (let row = 0; row < rows; row++) {
                for (let column = 0; column < columns; column++) {
                    const tile = document.createElement("div");

                    tile.className = "puzzle-tile";

                    tile.style.backgroundImage = `url('${currentImage}')`;
                    tile.style.backgroundSize =
                        `${columns * 100}% ${rows * 100}%`;

                    const x = column / (columns - 1) * 100;
                    const y = row / (rows - 1) * 100;

                    tile.style.backgroundPosition = `${x}% ${y}%`;

                    puzzleGrid.appendChild(tile);
                    tiles.push(tile);
                }
            }
        }

        function updatePuzzle(progress) {
            const revealedTiles = Math.floor(
                progress / 100 * totalTiles
            );

            tiles.forEach((tile, index) => {
                tile.classList.toggle(
                    "revealed",
                    index < revealedTiles
                );
            });

            imageMessage.style.display =
                progress === 0 ? "flex" : "none";
        }

        function updatePage() {
            const total = readNumber("sriramCount", 0);

            const target = Math.max(
                1,
                readNumber("sriramTarget", 108)
            );

            const remaining = Math.max(0, target - total);
            const progress = Math.min(100, total / target * 100);

            countDisplay.textContent = total;
            remainingDisplay.textContent = remaining;

            progressBar.style.width = progress + "%";

            progressText.textContent =
                progress.toFixed(1) + "% completed";

            updatePuzzle(progress);

            if (total >= target) {
                progressText.textContent =
                    "100% completed — Jai Shri Ram! 🙏";
            }
        }

        // Return to chanting without changing the count or target.
        document.getElementById("backButton")
            .addEventListener("click", () => {

                // Clear only the completion flag.
                // Keep the count, target and current image.
                localStorage.removeItem("sriramSessionCompleted");

                window.location.href = "jap.html";
            });

        // Reset the current chanting progress.
        document.getElementById("resetButton")
            .addEventListener("click", () => {

                if (confirm("Reset your chant count and image progress?")) {
                    localStorage.setItem("sriramCount", "0");
                    localStorage.setItem("sriramTarget", "108");

                    localStorage.removeItem("sriramCurrentImage");
                    localStorage.removeItem("sriramSessionCompleted");

                    updatePage();
                }
            });

        window.addEventListener("storage", updatePage);
        window.addEventListener("pageshow", updatePage);

        createPuzzle();
        updatePage();

        setInterval(updatePage, 1000);
    </script>
</body>
</html>
