
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sri Ram - Divine Image Formation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 28px 14px;
            min-height: 100vh;
            text-align: center;
            color: #f7edcf;
            font-family: 'Playfair Display', Georgia, serif;
            background:
                radial-gradient(circle at top, #263d62, transparent 48%),
                linear-gradient(145deg, #07152b, #102747, #071326);
        }

        .container {
            width: 100%;
            max-width: 680px;
            margin: auto;
            padding: 28px 22px;
            background: linear-gradient(145deg, #142c4b, #0b1b32);
            border: 2px solid #c7a65b;
            border-radius: 24px;
            box-shadow: 0 15px 45px #0008, inset 0 0 25px #d5b66b12;
        }

        .symbol {
            color: #e5c778;
            font-size: 30px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 12px 0;
            color: #e8ca7e;
            font-family: 'Cinzel', Georgia, serif;
            font-size: clamp(25px, 6vw, 39px);
            letter-spacing: 1px;
        }

        .subtitle {
            color: #e1d4b2;
            font-size: 16px;
            line-height: 1.7;
        }

        .image-frame {
            position: relative;
            width: 100%;
            max-width: 370px;
            height: 350px;
            margin: 26px auto;
            overflow: hidden;
            border: 5px solid #d7b66c;
            border-radius: 180px 180px 22px 22px;
            background: linear-gradient(160deg, #263e5c, #8b6937);
            box-shadow: 0 0 22px #d9b45c55, inset 0 0 20px #0006;
        }

        #puzzleGrid {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
        }

        .puzzle-tile {
            min-width: 0;
            min-height: 0;
            background-repeat: no-repeat;
            opacity: 0;
            transform: scale(0.65) rotate(5deg);
            transition:
                opacity 0.55s ease,
                transform 0.65s cubic-bezier(.2, .8, .2, 1);
            border: 1px solid #d9bd7950;
        }

        .puzzle-tile.revealed {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        #imageMessage {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 22px;
            color: #f5df9e;
            background: #07152b85;
            font-size: 18px;
            font-weight: bold;
            line-height: 1.7;
            text-shadow: 0 2px 8px #000;
            pointer-events: none;
        }

        .count-card {
            margin: 22px 0;
            padding: 22px 15px;
            background: linear-gradient(145deg, #1b3555, #102440);
            border: 1px solid #c7a65b;
            border-radius: 19px;
        }

        .count-card h2 {
            margin-top: 0;
            color: #e8ca7e;
            font-family: 'Cinzel', Georgia, serif;
            font-size: 20px;
        }

        #count {
            margin: 12px;
            color: #f1d58c;
            font-size: 55px;
            font-weight: bold;
        }

        .remaining {
            color: #e4d5b1;
            font-size: 18px;
            font-weight: bold;
        }

        #remaining {
            display: block;
            margin: 9px;
            color: #f1d58c;
            font-size: 34px;
        }

        .track {
            height: 17px;
            margin: 18px 0 10px;
            overflow: hidden;
            background: #07152b;
            border: 1px solid #b99a58;
            border-radius: 20px;
        }

        #progressBar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #b88b3d, #f5d98c, #c39748);
            border-radius: 20px;
            transition: width 0.5s ease;
        }

        #progressText {
            color: #e8d7b2;
            font-size: 16px;
        }

        button {
            margin: 8px 5px;
            padding: 13px 19px;
            border: 1px solid #e2c477;
            border-radius: 12px;
            color: #132541;
            background: linear-gradient(135deg, #f1d58c, #c49a4b);
            font: bold 15px 'Playfair Display', Georgia, serif;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 16px #d8b45c44;
        }

        #resetButton {
            color: #f3dfb0;
            background: #263b57;
            border-color: #b89b60;
        }

        .blessing {
            margin-top: 28px;
            color: #edcf80;
            font-family: 'Cinzel', Georgia, serif;
            font-size: 25px;
            font-weight: bold;
        }

        .footer-text {
            color: #d8c9a8;
            font-size: 15px;
            line-height: 1.7;
        }

        @media (max-width: 450px) {
            body {
                padding: 16px 9px;
            }

            .container {
                padding: 22px 13px;
            }

            .image-frame {
                height: 290px;
            }

            .count-card {
                padding: 18px 10px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <div class="symbol">🙏 🪷 🙏</div>

        <h1>Sri Ram Image Formation</h1>

        <p class="subtitle">
            Every chant brings you closer to revealing the divine image.
        </p>

        <div class="image-frame">
            <div id="puzzleGrid" aria-label="Sri Ram image gradually revealed as puzzle tiles"></div>

            <div id="imageMessage">
                Continue chanting to reveal the divine image 🙏
            </div>
        </div>

        <section class="count-card">
            <h2>Total Sri Ram Chants</h2>

            <div id="count">0</div>

            <p class="remaining">
                Chants remaining
                <span id="remaining">108</span>
            </p>

            <div class="track">
                <div id="progressBar"></div>
            </div>

            <p id="progressText">0% completed</p>
        </section>

        <button id="backButton">← Back to Chanting</button>
        <button id="resetButton">↻ Reset Count</button>

        <div class="blessing">॥ जय श्री राम ॥</div>

        <p class="footer-text">
            May Sri Ram bless you with peace and happiness. 🪔
        </p>

    </main>

    <script>
        const countDisplay = document.getElementById("count");
        const remainingDisplay = document.getElementById("remaining");
        const progressBar = document.getElementById("progressBar");
        const progressText = document.getElementById("progressText");
        const puzzleGrid = document.getElementById("puzzleGrid");
        const imageMessage = document.getElementById("imageMessage");

        const rows = 8;
        const columns = 8;
        const totalTiles = rows * columns;
        const tiles = [];

        function readNumber(key, fallback) {
            const value = Number(localStorage.getItem(key));

            return Number.isFinite(value) && value >= 0
                ? value
                : fallback;
        }

        function createPuzzle() {
            puzzleGrid.innerHTML = "";
            tiles.length = 0;

            for (let row = 0; row < rows; row++) {
                for (let column = 0; column < columns; column++) {
                    const tile = document.createElement("div");

                    tile.className = "puzzle-tile";
                    tile.style.backgroundImage = "url('sriram.jpg')";
                    tile.style.backgroundSize =
                        `${columns * 100}% ${rows * 100}%`;

                    const x = columns === 1
                        ? 0
                        : column / (columns - 1) * 100;

                    const y = rows === 1
                        ? 0
                        : row / (rows - 1) * 100;

                    tile.style.backgroundPosition = `${x}% ${y}%`;

                    puzzleGrid.appendChild(tile);
                    tiles.push(tile);
                }
            }
        }

        function updatePuzzle(progress) {
            const revealedTiles = Math.floor(
                progress / 100 * totalTiles
            );

            tiles.forEach((tile, index) => {
                tile.classList.toggle(
                    "revealed",
                    index < revealedTiles
                );
            });

            imageMessage.style.display =
                progress === 0 ? "flex" : "none";
        }

        function updatePage() {
            const total = readNumber("sriramCount", 0);
            const target = Math.max(
                1,
                readNumber("sriramTarget", 108)
            );

            const remaining = Math.max(0, target - total);
            const progress = Math.min(100, total / target * 100);

            countDisplay.textContent = total;
            remainingDisplay.textContent = remaining;

            progressBar.style.width = progress + "%";

            progressText.textContent =
                progress.toFixed(1) + "% completed";

            updatePuzzle(progress);

            if (total >= target) {
                progressText.textContent =
                    "100% completed — Jai Shri Ram! 🙏";
            }
        }

        document.getElementById("backButton")
            .addEventListener("click", () => {
                window.location.href = "jap.html";
            });

        document.getElementById("resetButton")
            .addEventListener("click", () => {
                if (confirm("Reset your chant count and image progress?")) {
                    localStorage.setItem("sriramCount", "0");
                    updatePage();
                }
            });

        window.addEventListener("storage", updatePage);

        window.addEventListener("pageshow", updatePage);

        createPuzzle();
        updatePage();

        setInterval(updatePage, 1000);
    </script>
</body>
</html>
